[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "inventory"
version = "1.0.0"
description = "Inventory and stock control: products, suppliers, purchase orders, stock movements, valuation and reorder alerts."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Umer Hashmi" }]
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.27", "pydantic>=2.6"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.5", "httpx>=0.27"]

[project.scripts]
inventory = "inventory.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
